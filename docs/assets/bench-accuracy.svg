<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 430" width="572" role="img" aria-label="Agent trials: accuracy">
<title>Agent trials: accuracy</title>
<style>
svg{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b1530;--ink2:#34426b;--muted:#5f6e95;--grid:#d9dfee;--card:#ffffff;--edge:#d5ddee;font-family:'Segoe UI','Inter',Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){svg{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#e8eef9;--ink2:#b6c3e0;--muted:#8fa1c7;--grid:#22305a;--card:#0e1730;--edge:#22305a}}
.t{font-size:17px;font-weight:700;fill:var(--ink)} .s{font-size:12.5px;fill:var(--muted)} .lg{font-size:12.5px;fill:var(--ink2)}
text{fill:var(--ink2);font-size:13px} .val{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;fill:var(--ink)}
.tick{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;fill:var(--muted)} .gridline{stroke:var(--grid);stroke-width:1}
</style>
<rect x=".5" y=".5" width="571" height="429" rx="14" fill="var(--card)" stroke="var(--edge)"/>
<text class="t" x="24" y="34">Agent trials: accuracy</text><text class="s" x="24" y="54">Share of fields correct against independent ground truth.</text>
<rect x="24.0" y="66" width="12" height="12" rx="3" fill="var(--s3)"/><text class="lg" x="42.0" y="76.5">Browser-only agent (page fetch)</text><rect x="268.6" y="66" width="12" height="12" rx="3" fill="var(--s2)"/><text class="lg" x="286.6" y="76.5">Shell agent (curl/python + web, no MCP)</text><rect x="566.0" y="66" width="12" height="12" rx="3" fill="var(--s1)"/><text class="lg" x="584.0" y="76.5">Agent + iran-bourse-mcp</text>
<g transform="translate(24 96)"><line class="gridline" x1="190" x2="190" y1="6" y2="290"></line><text class="tick" x="190" y="306" text-anchor="middle">0%</text><line class="gridline" x1="241.6" x2="241.6" y1="6" y2="290"></line><text class="tick" x="241.6" y="306" text-anchor="middle">20%</text><line class="gridline" x1="293.2" x2="293.2" y1="6" y2="290"></line><text class="tick" x="293.2" y="306" text-anchor="middle">40%</text><line class="gridline" x1="344.79999999999995" x2="344.79999999999995" y1="6" y2="290"></line><text class="tick" x="344.79999999999995" y="306" text-anchor="middle">60%</text><line class="gridline" x1="396.4" x2="396.4" y1="6" y2="290"></line><text class="tick" x="396.4" y="306" text-anchor="middle">80%</text><line class="gridline" x1="448" x2="448" y1="6" y2="290"></line><text class="tick" x="448" y="306" text-anchor="middle">100%</text><text x="178" y="39" text-anchor="end" font-size="13">Ticks of one day</text><path class="bar" d="M190 12h60.5a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-60.5z" fill="var(--s3)" data-tip="&lt;b&gt;Ticks of one day&lt;/b&gt;&lt;br&gt;Browser-only agent (page fetch): 25% of fields correct"></path><text class="val" x="260.5" y="23">25%</text><path class="bar" d="M190 28h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s2)" data-tip="&lt;b&gt;Ticks of one day&lt;/b&gt;&lt;br&gt;Shell agent (curl/python + web, no MCP): 100% of fields correct"></path><text class="val" x="454" y="39">100%</text><path class="bar" d="M190 44h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s1)" data-tip="&lt;b&gt;Ticks of one day&lt;/b&gt;&lt;br&gt;Agent + iran-bourse-mcp: 100% of fields correct"></path><text class="val" x="454" y="55">100%</text><text x="178" y="109" text-anchor="end" font-size="13">Real-person money flow</text><path class="bar" d="M190 82h1a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-1z" fill="var(--s3)" data-tip="&lt;b&gt;Real-person money flow&lt;/b&gt;&lt;br&gt;Browser-only agent (page fetch): 0% of fields correct"></path><text class="val" x="198" y="93">0%</text><path class="bar" d="M190 98h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s2)" data-tip="&lt;b&gt;Real-person money flow&lt;/b&gt;&lt;br&gt;Shell agent (curl/python + web, no MCP): 100% of fields correct"></path><text class="val" x="454" y="109">100%</text><path class="bar" d="M190 114h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s1)" data-tip="&lt;b&gt;Real-person money flow&lt;/b&gt;&lt;br&gt;Agent + iran-bourse-mcp: 100% of fields correct"></path><text class="val" x="454" y="125">100%</text><text x="178" y="179" text-anchor="end" font-size="13">Codal filings</text><path class="bar" d="M190 152h1a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-1z" fill="var(--s3)" data-tip="&lt;b&gt;Codal filings&lt;/b&gt;&lt;br&gt;Browser-only agent (page fetch): 0% of fields correct"></path><text class="val" x="198" y="163">0%</text><path class="bar" d="M190 168h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s2)" data-tip="&lt;b&gt;Codal filings&lt;/b&gt;&lt;br&gt;Shell agent (curl/python + web, no MCP): 100% of fields correct"></path><text class="val" x="454" y="179">100%</text><path class="bar" d="M190 184h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s1)" data-tip="&lt;b&gt;Codal filings&lt;/b&gt;&lt;br&gt;Agent + iran-bourse-mcp: 100% of fields correct"></path><text class="val" x="454" y="195">100%</text><text x="178" y="249" text-anchor="end" font-size="13">One-year adjusted return</text><path class="bar" d="M190 222h1a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-1z" fill="var(--s3)" data-tip="&lt;b&gt;One-year adjusted return&lt;/b&gt;&lt;br&gt;Browser-only agent (page fetch): 0% of fields correct"></path><text class="val" x="198" y="233">0%</text><path class="bar" d="M190 238h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s2)" data-tip="&lt;b&gt;One-year adjusted return&lt;/b&gt;&lt;br&gt;Shell agent (curl/python + web, no MCP): 100% of fields correct"></path><text class="val" x="454" y="249">100%</text><path class="bar" d="M190 254h254a4 4 0 0 1 4 4v6a4 4 0 0 1 -4 4h-254z" fill="var(--s1)" data-tip="&lt;b&gt;One-year adjusted return&lt;/b&gt;&lt;br&gt;Agent + iran-bourse-mcp: 100% of fields correct"></path><text class="val" x="454" y="265">100%</text></g>
