name: Bug report / broken endpoint
description: A tool returns wrong, empty or failing data
labels: [bug]
body:
  - type: input
    id: tool
    attributes:
      label: Tool and arguments
      placeholder: "quote(symbol='فولاد')"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `iran-bourse-mcp doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: Raw upstream URL / response snippet (optional)
      render: text
  - type: input
    id: env
    attributes:
      label: Version, Python, OS, MCP client
